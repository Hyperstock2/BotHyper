<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HyperStock — Acceso</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="login-page">
  <!-- Ambient -->
  <div class="ambient"><div class="orb orb-a"></div><div class="orb orb-b"></div><div class="orb orb-c"></div></div>
  <div class="mesh"></div>

  <div class="login-card" style="position:relative;z-index:1">
    <div class="login-icon">⚡</div>
    <div class="login-h1">HyperStock</div>
    <div class="login-sub">Panel de control del servidor</div>

    <div id="err" class="alert-error" style="display:none">
      <span>🔒</span> Credenciales incorrectas. Inténtalo de nuevo.
    </div>

    <form class="login-form" action="/login" method="POST" autocomplete="off">
      <div class="f-group">
        <label class="f-label">Usuario</label>
        <input class="f-input" type="text" name="username" placeholder="Nombre de usuario" required/>
      </div>
      <div class="f-group">
        <label class="f-label">Contraseña</label>
        <input class="f-input" type="password" name="password" placeholder="••••••••••" required/>
      </div>
      <button type="submit" class="btn-login">Ingresar al Panel <span>→</span></button>
    </form>

    <div class="login-footer">HyperStock Bot Panel v3.0 · 2024</div>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).get('error'))
      document.getElementById('err').style.display = 'flex';
  </script>
</body>
</html>
