<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HyperStock — Panel</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="login-page">

  <!-- Orbs ambientales -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">⚡</div>
        <h1>HyperStock</h1>
        <p>Accede al panel de control del servidor</p>
      </div>

      <div id="error-msg" class="alert-error" style="display:none">
        <span>🔒</span> Credenciales incorrectas. Intenta de nuevo.
      </div>

      <form action="/login" method="POST" autocomplete="off">
        <div class="form-group">
          <label class="form-label">Usuario</label>
          <div class="form-input-wrap">
            <input class="form-input" type="text" name="username"
              placeholder="Ingresa tu usuario" required autocomplete="off"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <div class="form-input-wrap">
            <input class="form-input" type="password" name="password"
              placeholder="••••••••••" required/>
          </div>
        </div>
        <button type="submit" class="btn-login">
          Ingresar al Panel &nbsp;→
        </button>
      </form>

      <p class="login-footer-text">HyperStock Panel v2.0 · 2024</p>
    </div>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).get('error'))
      document.getElementById('error-msg').style.display = 'flex';
  </script>
</body>
</html>
