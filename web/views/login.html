<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solo: Hyper Stock</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/3wbMrg35/a05e063b-f36c-4834-852f-801391431695.jpg"/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="login-page">
  <div class="bg-particles">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  </div>
  <div class="mesh"></div>

  <div class="login-card">
    <img class="login-logo-img"
      src="https://i.postimg.cc/3wbMrg35/a05e063b-f36c-4834-852f-801391431695.jpg"
      alt="HyperStock"
      draggable="false"
      onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'"/>
    <div id="logo-fallback" style="display:none;width:88px;height:88px;border-radius:20px;background:var(--a1);align-items:center;justify-content:center;font-size:38px;margin:0 auto 20px;border:2px solid var(--br3)">⚡</div>

    <div class="login-h1">Hyper Stock</div>
    <div class="login-by">By Developer Juanffx</div>

    <div id="err" class="alert-error" style="display:none;margin-top:18px">
      <span>🔒</span> Credenciales incorrectas. Inténtalo de nuevo.
    </div>

    <form class="login-form" action="/login" method="POST" autocomplete="off">
      <div class="f-group">
        <label class="f-label">Usuario</label>
        <input class="f-input" type="text" name="username" placeholder="Nombre de usuario" required autocomplete="off"/>
      </div>
      <div class="f-group">
        <label class="f-label">Contraseña</label>
        <input class="f-input" type="password" name="password" placeholder="••••••••••" required/>
      </div>
      <button type="submit" class="btn-login">Ingresar al Panel →</button>
    </form>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).get('error'))
      document.getElementById('err').style.display = 'flex';
  </script>
</body>
</html>
